name: Test

on:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test.yml"

jobs:
  rspec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
          working-directory: .github/scripts

      - run: bundle exec rspec
